<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Real org logo (from the org's Facebook page), generated at the sizes browsers actually request. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075b9e" />
    <meta
      name="description"
      content="Namuna Apanga Samaj Rasuwa (Model Disabled Society Rasuwa) — a disability-rights organisation based in Naukunda, Rasuwa, Nepal."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://modeldisabledsocietyrasuwa.org.np/" />

    <!--
      Open Graph / Twitter Card preview tags, modeled on the same pattern
      used on suyogdhungel.com.np. og-image.png (1200x630, the size social
      platforms crop to) is generated from the org's real logo — see
      scripts/ or ask Suyog for the generator if it needs regenerating.
      Update the og:url / twitter:url values here if the site is ever
      published under a different domain than the one above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://modeldisabledsocietyrasuwa.org.np/" />
    <meta property="og:title" content="Namuna Apanga Samaj Rasuwa" />
    <meta
      property="og:description"
      content="Namuna Apanga Samaj Rasuwa (Model Disabled Society Rasuwa) — a disability-rights organisation based in Naukunda, Rasuwa, Nepal."
    />
    <meta property="og:site_name" content="Namuna Apanga Samaj Rasuwa" />
    <meta property="og:locale" content="en_NP" />
    <meta property="og:locale:alternate" content="ne_NP" />
    <meta property="og:image" content="https://modeldisabledsocietyrasuwa.org.np/og-image.png" />
    <meta property="og:image:secure_url" content="https://modeldisabledsocietyrasuwa.org.np/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Namuna Apanga Samaj Rasuwa logo and name on a blue background" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://modeldisabledsocietyrasuwa.org.np/" />
    <meta name="twitter:title" content="Namuna Apanga Samaj Rasuwa" />
    <meta
      name="twitter:description"
      content="Namuna Apanga Samaj Rasuwa (Model Disabled Society Rasuwa) — a disability-rights organisation based in Naukunda, Rasuwa, Nepal."
    />
    <meta name="twitter:image" content="https://modeldisabledsocietyrasuwa.org.np/og-image.png" />
    <meta name="twitter:image:alt" content="Namuna Apanga Samaj Rasuwa logo and name on a blue background" />

    <!--
      Fonts are self-hosted via @fontsource (bundled by Vite, imported in
      main.jsx) rather than loaded from fonts.googleapis.com -- more
      reliable for visitors on slow or restricted connections, and it keeps
      the Content-Security-Policy in vercel.json from needing to trust an
      external font host.
    -->
    <title>Namuna Apanga Samaj Rasuwa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
